[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaiia-prime-radiant"
version = "0.1.0"
description = "Scale-spanning simulation engine integrated with Gaiia RAG-Doll"
readme = "README.md"
authors = [
    { name = "Gaiia Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "ollama>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "api*"]
